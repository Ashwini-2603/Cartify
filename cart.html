<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Cartify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --primary-color: #0d9488;
            --primary-hover: #0f766e;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
        }

        body.dark-mode {
            --bg-color: #0f172a !important;
            --card-bg: #1e293b !important;
            --text-color: #f8fafc !important;
            --border-color: #334155 !important;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-color) !important;
            color: var(--text-color) !important;
            min-height: 100vh;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .cart-container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .cart-container { grid-template-columns: 1fr; }
        }

        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .cart-item img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 6px;
            background: white;
            padding: 5px;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .qty-btn {
            background: var(--border-color);
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-color);
            font-weight: bold;
        }

        .summary-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            height: fit-content;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .coupon-box {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .coupon-box input {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: transparent;
            color: var(--text-color);
        }

        .remove-btn {
            color: #ef4444;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .btn-primary, .btn-secondary {
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 2rem;
            border-radius: 12px;
            max-width: 450px;
            width: 90%;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.5rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h2><a href="index.html" style="text-decoration: none; color: inherit;">Cartify<span style="color: var(--primary-color);">.</span></a></h2>
        </div>
        <a href="index.html" class="btn-secondary" style="text-decoration: none;">
            <i class="fa-solid fa-arrow-left"></i> Back to Shop
        </a>
    </header>

    <main class="cart-container">
        <!-- Cart Items List -->
        <section id="cart-items-list"></section>

        <!-- Order Summary -->
        <section class="summary-card">
            <h3>Order Summary</h3>
            <hr style="margin: 1rem 0; border-color: var(--border-color);">

            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal-val">₹0</span>
            </div>
            <div class="summary-row">
                <span>Tax (18% GST)</span>
                <span id="tax-val">₹0</span>
            </div>
            <div class="summary-row">
                <span>Delivery Charge</span>
                <span id="delivery-val">₹50</span>
            </div>
            <div class="summary-row" id="discount-row" style="display: none; color: #10b981;">
                <span>Discount (10%)</span>
                <span id="discount-val">-₹0</span>
            </div>

            <div class="coupon-box">
                <input type="text" id="coupon-input" placeholder="Promo: CARTIFY10">
                <button class="btn-secondary" onclick="applyCoupon()">Apply</button>
            </div>
            <p id="coupon-msg" style="font-size: 0.85rem; margin-bottom: 1rem;"></p>

            <hr style="margin: 1rem 0; border-color: var(--border-color);">

            <div class="summary-row" style="font-size: 1.2rem; font-weight: bold;">
                <span>Total Amount</span>
                <span id="total-val" style="color: var(--primary-color);">₹0</span>
            </div>

            <button class="btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;" onclick="checkout()">
                Proceed to Checkout
            </button>
        </section>
    </main>

    <!-- Checkout & Order Invoice Modal -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCheckoutModal()">&times;</span>
            
            <div id="checkout-step-1">
                <h3 style="margin-bottom: 1rem;">Shipping & Payment Details</h3>
                <form id="checkout-form" onsubmit="processOrder(event)">
                    <input type="text" id="cust-name" placeholder="Full Name" required style="width: 100%; padding: 0.6rem; margin-bottom: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color);">
                    <input type="email" id="cust-email" placeholder="Email Address" required style="width: 100%; padding: 0.6rem; margin-bottom: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color);">
                    <textarea id="cust-address" placeholder="Delivery Address" required style="width: 100%; padding: 0.6rem; margin-bottom: 0.8rem; border-radius: 6px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color);"></textarea>
                    
                    <select id="payment-mode" style="width: 100%; padding: 0.6rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color);">
                        <option value="UPI">UPI / Online Payment</option>
                        <option value="COD">Cash on Delivery (COD)</option>
                    </select>
                    
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 0.7rem;">Place Order & Generate Invoice</button>
                </form>
            </div>

            <div id="checkout-step-2" style="display: none; text-align: center;">
                <i class="fa-solid fa-circle-check" style="font-size: 3rem; color: #10b981; margin-bottom: 0.5rem;"></i>
                <h2>Order Placed Successfully!</h2>
                <p style="font-size: 0.9rem; margin-bottom: 1rem; color: #64748b;">Order ID: <strong id="inv-order-id">#CRT-9982</strong></p>
                
                <div id="invoice-details" style="text-align: left; background: var(--bg-color); padding: 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; border: 1px solid var(--border-color);"></div>
                
                <button class="btn-primary" onclick="window.print()" style="width: 100%; padding: 0.6rem; margin-bottom: 0.5rem;"><i class="fa-solid fa-print"></i> Print Invoice</button>
                <a href="index.html" class="btn-secondary" style="display: block; text-decoration: none; padding: 0.6rem; text-align: center;">Continue Shopping</a>
            </div>
        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
